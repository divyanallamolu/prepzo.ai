<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo — Interview Room</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen page-enter">
  <nav class="navbar" style="position:sticky">
    <div class="navbar-inner" style="flex-direction:column;align-items:stretch;height:auto;padding:0.75rem 1.25rem">
      <div class="flex items-center justify-between w-full">
        <a href="/dashboard.html" class="text-sm text-muted">← Dashboard</a>
        <h1 id="company-title" class="font-semibold text-lg">Interview Room</h1>
        <div class="theme-toggle" data-theme-toggle><div class="theme-toggle-knob"></div></div>
      </div>
      <p id="session-timer-label" class="text-xs text-muted text-center mt-2">Session: --:--</p>
      <div class="interview-session-bar mt-1">
        <div id="session-timer-fill" class="interview-session-bar-fill" style="width:100%"></div>
      </div>
    </div>
  </nav>

  <div class="container" style="padding:2rem 1.25rem;max-width:1100px">
    <div class="interview-grid">
      <aside class="glass-card card-pad" style="height:fit-content;position:sticky;top:120px">
        <div class="interview-progress-header">
          <span>Progress</span>
          <span id="progress-text">0 / 0</span>
        </div>
        <div class="progress-bar mb-4"><div id="progress-bar" class="progress-bar-fill" style="width:0%"></div></div>
        <p id="timer-hint" class="text-xs text-muted mb-3">Timer loads per difficulty & company</p>
        <div id="question-list" style="max-height:240px;overflow-y:auto;font-size:0.8rem"></div>
      </aside>

      <main>
        <div class="glass-card card-pad mb-6">
          <div class="flex flex-wrap gap-2 mb-4" id="badges"></div>
          <p id="question-text" class="text-xl font-medium leading-tight mb-6">Loading...</p>

          <div id="timer-section">
            <div id="timer-ring-wrap" class="timer-ring-wrap">
              <svg class="timer-ring-svg" viewBox="0 0 120 120">
                <circle class="timer-track" cx="60" cy="60" r="54" fill="none" stroke-width="6"/>
                <circle id="timer-circle" class="timer-progress" cx="60" cy="60" r="54" fill="none" stroke-width="6"
                  stroke-dasharray="339.292" stroke-dashoffset="0" stroke-linecap="round"/>
              </svg>
              <div class="timer-center-label">
                <span id="timer-display" class="timer-display-main">3:00</span>
                <span class="timer-display-sub">Thinking time</span>
              </div>
            </div>
            <p class="timer-meta" id="timer-meta">Answer hidden until timer ends</p>
            <div class="timer-controls">
              <button type="button" id="timer-pause-btn" class="btn-ghost btn-sm">⏸ Pause</button>
              <button type="button" id="timer-resume-btn" class="btn-ghost btn-sm hidden">▶ Resume</button>
              <button type="button" id="timer-reset-btn" class="btn-ghost btn-sm">↺ Reset</button>
              <button type="button" id="reveal-now-btn" class="btn-primary btn-sm hidden">Reveal Answer</button>
            </div>
          </div>

          <div id="answer-section" class="hidden">
            <div class="mb-6">
              <h3 class="text-sm font-semibold text-accent mb-2">Your Answer</h3>
              <textarea id="user-answer" rows="5" class="input" placeholder="Type or use voice input..."></textarea>
              <button type="button" id="voice-btn" class="btn-ghost btn-sm mt-2">🎤 Start Voice Input</button>
            </div>
            <div class="mb-4 p-4 rounded-xl" style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2)">
              <h3 class="font-semibold mb-2" style="color:#22c55e">Ideal Answer</h3>
              <p id="answer-text" class="text-sm"></p>
            </div>
            <div class="mb-4 p-4 rounded-xl" style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2)">
              <h3 class="font-semibold mb-2" style="color:#818cf8">Explanation</h3>
              <p id="explanation-text" class="text-sm"></p>
            </div>
            <div id="tips-block" class="hidden mb-4"><h3 class="font-semibold mb-2">Tips</h3><ul id="tips-list" class="text-sm text-muted"></ul></div>
            <div id="keypoints-block" class="hidden mb-4"><h3 class="font-semibold mb-2">Key Points</h3><ul id="keypoints-list" class="text-sm text-muted"></ul></div>
            <p id="year-asked" class="text-sm text-muted mb-2"></p>
            <p id="time-spent-label" class="text-xs text-muted mb-4"></p>
            <button type="button" id="evaluate-btn" class="btn-primary">Evaluate My Answer with AI</button>
            <div id="eval-result" class="hidden glass-card card-pad mt-4"></div>
          </div>

          <div class="flex flex-wrap gap-3 mt-6">
            <button type="button" id="prev-btn" class="btn-ghost btn-sm" disabled>Previous</button>
            <button type="button" id="bookmark-btn" class="btn-ghost btn-sm">Bookmark</button>
            <button type="button" id="next-btn" class="btn-primary btn-sm" style="margin-left:auto">Next Question</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/interview-timer.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');

    const params = new URLSearchParams(location.search);
    const companyId = params.get('company');
    const companyName = params.get('name') || 'Interview';

    window.InterviewRoom = { companyId, companyName };

    document.getElementById('company-title').textContent = companyName;

    let questions = [];
    let currentIndex = 0;
    let revealedEarly = false;

    InterviewTimer.circumference = 2 * Math.PI * 54;
    InterviewTimer.onReveal = () => revealAnswer();
    InterviewTimer.onSessionEnd = () => {
      Components.toast('Interview session time ended', 'error');
      if (currentIndex < questions.length - 1) {
        setTimeout(() => { location.href = '/results.html?company=' + companyId; }, 1500);
      }
    };

    document.getElementById('timer-pause-btn').onclick = () => InterviewTimer.pause();
    document.getElementById('timer-resume-btn').onclick = () => InterviewTimer.resume();
    document.getElementById('timer-reset-btn').onclick = () => {
      revealedEarly = false;
      InterviewTimer.reset();
    };
    document.getElementById('reveal-now-btn').onclick = () => {
      revealedEarly = true;
      InterviewTimer.triggerReveal();
    };

    async function loadQuestions() {
      try {
        questions = await Api.questions.list({ company_id: companyId, preview: 'true' });
        if (!questions.length) questions = await Api.questions.list({ company_id: companyId });
        if (!questions.length) {
          document.getElementById('question-text').textContent = 'No questions for this company yet.';
          return;
        }
        InterviewTimer.startSessionTimer();
        renderQuestionList();
        showQuestion(0);
      } catch {
        document.getElementById('question-text').textContent = 'Failed to load questions. Is the server running?';
      }
    }

    function renderQuestionList() {
      document.getElementById('question-list').innerHTML = questions.map((q, i) =>
        `<button type="button" onclick="showQuestion(${i})" style="display:block;width:100%;text-align:left;padding:0.35rem 0.5rem;border:none;background:${i === currentIndex ? 'var(--accent-soft)' : 'transparent'};color:${i === currentIndex ? 'var(--accent)' : 'inherit'};border-radius:6px;cursor:pointer;margin-bottom:2px">Q${i + 1} · ${q.difficulty}</button>`
      ).join('');
    }

    window.showQuestion = async function (idx) {
      currentIndex = idx;
      revealedEarly = false;
      InterviewTimer.revealed = false;

      document.getElementById('answer-section').classList.add('hidden');
      document.getElementById('timer-section').classList.remove('hidden');
      document.getElementById('eval-result').classList.add('hidden');
      document.getElementById('tips-block').classList.add('hidden');
      document.getElementById('keypoints-block').classList.add('hidden');
      document.getElementById('user-answer').value = '';

      const q = questions[idx];
      document.getElementById('question-text').textContent = q.question;
      document.getElementById('badges').innerHTML =
        Components.difficultyBadge(q.difficulty) + ' ' + Components.categoryBadge(q.category);
      document.getElementById('progress-bar').style.width = ((idx + 1) / questions.length * 100) + '%';
      document.getElementById('progress-text').textContent = `${idx + 1} / ${questions.length}`;
      document.getElementById('prev-btn').disabled = idx === 0;
      document.getElementById('next-btn').textContent =
        idx === questions.length - 1 ? 'Finish → Results' : 'Next Question';

      const meta = document.getElementById('timer-meta');
      await InterviewTimer.startQuestionTimer(q.difficulty);
      const s = InterviewTimer.settings;
      meta.textContent = s.auto_reveal
        ? `Auto-reveal after ${InterviewTimer.formatTime(s.thinking_seconds)} (+ ${s.reveal_delay_seconds || 0}s delay)`
        : 'Manual reveal — click Reveal Answer when ready';

      document.getElementById('timer-hint').textContent =
        `${q.difficulty}: ${s.thinking_seconds}s thinking · Session ${InterviewTimer.formatTime(s.interview_duration_seconds)}`;

      renderQuestionList();
    };

    async function revealAnswer() {
      if (InterviewTimer.revealed && document.getElementById('answer-section').classList.contains('hidden') === false) return;
      InterviewTimer.revealed = true;

      document.getElementById('timer-section').classList.add('hidden');
      document.getElementById('answer-section').classList.remove('hidden');

      let q = questions[currentIndex];
      if (!q.answer) {
        q = await Api.questions.get(q.id);
        questions[currentIndex] = q;
      }
      document.getElementById('answer-text').textContent = q.answer;
      document.getElementById('explanation-text').textContent = q.explanation;
      document.getElementById('year-asked').textContent = q.year_asked ? `Year asked: ${q.year_asked}` : '';

      const spent = InterviewTimer.getTimeSpent();
      const thinking = InterviewTimer.getThinkingUsed();
      document.getElementById('time-spent-label').textContent =
        `Time on question: ${InterviewTimer.formatTime(spent)} · Thinking timer used: ${InterviewTimer.formatTime(thinking)}${revealedEarly ? ' (revealed early)' : ''}`;

      if (q.tips?.length) {
        document.getElementById('tips-block').classList.remove('hidden');
        document.getElementById('tips-list').innerHTML = q.tips.map(t => `<li>${t}</li>`).join('');
      }
      if (q.key_points?.length) {
        document.getElementById('keypoints-block').classList.remove('hidden');
        document.getElementById('keypoints-list').innerHTML = q.key_points.map(k => `<li>${k}</li>`).join('');
      }
    }

    document.getElementById('next-btn').onclick = () => {
      if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
      else location.href = '/results.html?company=' + companyId;
    };
    document.getElementById('prev-btn').onclick = () => {
      if (currentIndex > 0) showQuestion(currentIndex - 1);
    };

    document.getElementById('bookmark-btn').onclick = async () => {
      const q = questions[currentIndex];
      try {
        await Api.progress.bookmark({
          question_id: q.id,
          company_name: companyName,
          question_text: q.question,
        });
        Components.toast('Bookmarked!');
      } catch (ex) {
        Components.toast(ex.message, 'error');
      }
    };

    document.getElementById('evaluate-btn').onclick = async () => {
      const q = questions[currentIndex];
      const userAns = document.getElementById('user-answer').value;
      if (!userAns.trim()) {
        Components.toast('Enter or speak your answer first', 'error');
        return;
      }
      const btn = document.getElementById('evaluate-btn');
      btn.disabled = true;
      btn.textContent = 'Evaluating...';
      try {
        const result = await Api.evaluate({
          user_answer: userAns,
          ideal_answer: q.answer,
          question: q.question,
          category: q.category,
        });
        await Api.progress.save({
          company_id: companyId,
          company_name: companyName,
          question_id: q.id,
          score: result.overall_score,
          category: q.category,
          difficulty: q.difficulty,
          user_answer: userAns,
          thinking_seconds_used: InterviewTimer.getThinkingUsed(),
          time_spent_seconds: InterviewTimer.getTimeSpent(),
          revealed_early: revealedEarly,
        });
        const el = document.getElementById('eval-result');
        el.classList.remove('hidden');
        el.innerHTML = `
          <div class="flex items-center gap-4 mb-4">
            <div class="score-ring">${result.overall_score}</div>
            <div>
              <p class="font-bold text-lg">Overall Score</p>
              <p class="text-sm text-muted">Content: ${result.similarity_score}% · Communication: ${result.communication_score}%</p>
            </div>
          </div>
          <p class="text-sm mb-2">${result.feedback}</p>
          <ul class="text-sm text-muted">${(result.suggestions || []).map(s => `<li style="margin:0.35rem 0">• ${s}</li>`).join('')}</ul>`;
      } catch (ex) {
        Components.toast(ex.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Evaluate My Answer with AI';
      }
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      document.getElementById('voice-btn').onclick = () => {
        rec.onresult = (e) => {
          let t = '';
          for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
          document.getElementById('user-answer').value = t;
        };
        rec.start();
        document.getElementById('voice-btn').textContent = '🔴 Listening...';
        rec.onend = () => {
          document.getElementById('voice-btn').textContent = '🎤 Start Voice Input';
        };
      };
    } else {
      document.getElementById('voice-btn').style.display = 'none';
    }

    window.addEventListener('beforeunload', () => InterviewTimer.destroy());
    loadQuestions();
  </script>
</body>
</html>
