<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo — Interview Room</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen page-enter interview-page">
  <nav class="navbar interview-nav">
    <div class="navbar-inner interview-nav-inner">
      <a href="/dashboard.html" class="text-sm text-muted">← Dashboard</a>
      <h1 id="company-title" class="page-heading-sm">Interview Room</h1>
      <div class="theme-toggle" data-theme-toggle><div class="theme-toggle-knob"></div></div>
      <p id="session-timer-label" class="text-xs text-muted text-center w-full">Quiz: --:--</p>
      <div class="interview-session-bar">
        <div id="session-timer-fill" class="interview-session-bar-fill" style="width:100%"></div>
      </div>
    </div>
  </nav>

  <div class="container interview-container">
    <div class="interview-grid">
      <aside class="glass-card card-pad interview-sidebar">
        <div class="interview-progress-header">
          <span>Progress</span>
          <span id="progress-text">0 / 0</span>
        </div>
        <div class="progress-bar mb-4"><div id="progress-bar" class="progress-bar-fill" style="width:0%"></div></div>

        <label class="practice-toggle">
          <input type="checkbox" id="practice-no-timer">
          <span>Practice without timer</span>
        </label>
        <p class="text-xs text-muted mb-4">Prep time (45s) is always required before you can type.</p>

        <p id="timer-hint" class="text-xs text-muted mb-3"></p>
        <div id="question-list" class="question-list-mini"></div>
      </aside>

      <main class="interview-main">
        <div class="glass-card card-pad">
          <div class="flex flex-wrap gap-2 mb-4" id="badges"></div>
          <p id="phase-label" class="phase-label">Loading...</p>
          <p id="phase-sublabel" class="text-sm text-muted mb-4"></p>
          <p id="question-text" class="question-display">Loading...</p>

          <div id="timer-section">
            <div id="timer-ring-wrap" class="timer-ring-wrap">
              <svg class="timer-ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="timer-track" cx="60" cy="60" r="54" fill="none" stroke-width="6"/>
                <circle id="timer-circle" class="timer-progress" cx="60" cy="60" r="54" fill="none" stroke-width="6"
                  stroke-dasharray="339.292" stroke-dashoffset="0" stroke-linecap="round"/>
              </svg>
              <div class="timer-center-label">
                <span id="timer-display" class="timer-display-main">0:45</span>
                <span class="timer-display-sub">Prep time (required)</span>
              </div>
            </div>
            <div class="phase-progress-bar mt-4">
              <div id="phase-progress-fill" class="phase-progress-fill"></div>
            </div>
          </div>

          <div id="answer-input-section" class="hidden mt-6">
            <h3 class="section-label">Your Answer</h3>
            <textarea id="user-answer" rows="6" class="input" placeholder="Type your answer here (unlocked after prep)..." disabled></textarea>
            <button type="button" id="voice-btn" class="btn-ghost btn-sm mt-2">🎤 Voice input</button>
            <button type="button" id="submit-answer-btn" class="btn-primary mt-4 w-full">Submit Answer</button>
          </div>

          <div id="feedback-section" class="hidden mt-6">
            <div class="ideal-answer-block mb-4">
              <h3 class="section-label section-label-success">Ideal Answer</h3>
              <p id="answer-text" class="text-sm"></p>
            </div>
            <div class="explanation-block mb-4">
              <h3 class="section-label section-label-info">Explanation</h3>
              <p id="explanation-text" class="text-sm"></p>
            </div>
            <div id="tips-block" class="hidden mb-4"><h3 class="section-label">Tips</h3><ul id="tips-list" class="text-sm text-muted"></ul></div>
            <div id="keypoints-block" class="hidden mb-4"><h3 class="section-label">Key Points</h3><ul id="keypoints-list" class="text-sm text-muted"></ul></div>
            <p id="year-asked" class="text-sm text-muted mb-2"></p>
            <p id="time-spent-label" class="text-xs text-muted mb-4"></p>
            <button type="button" id="evaluate-btn" class="btn-primary w-full">Evaluate with AI</button>
            <div id="eval-result" class="hidden glass-card card-pad mt-4"></div>
          </div>

          <div class="interview-actions mt-6">
            <button type="button" id="prev-btn" class="btn-ghost btn-sm" disabled>Previous</button>
            <button type="button" id="bookmark-btn" class="btn-ghost btn-sm">Bookmark</button>
            <button type="button" id="next-btn" class="btn-primary btn-sm">Next Question</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/interview-timer.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');

    const params = new URLSearchParams(location.search);
    const isMixed = params.get('mode') === 'mixed';
    const companyId = params.get('company') || '';
    const companyName = isMixed ? 'Mixed Companies' : (params.get('name') || 'Interview');
    const dailyId = params.get('daily');

    window.InterviewRoom = { companyId, companyName, isMixed };

    document.getElementById('company-title').textContent = companyName;

    let questions = [];
    let currentIndex = 0;
    let submitted = false;

    InterviewTimer.circumference = 2 * Math.PI * 54;
    InterviewTimer.onPrepEnd = () => {
      document.getElementById('user-answer').disabled = false;
    };
    InterviewTimer.onAnswerEnd = () => {
      if (!submitted) {
        Components.toast('Time is up — submitting...', 'error');
        submitAnswer(true);
      }
    };
    InterviewTimer.onQuizEnd = () => {
      Components.toast('30-minute quiz limit reached', 'error');
      finishInterview();
    };

    document.getElementById('practice-no-timer').onchange = (e) => {
      InterviewTimer.practiceWithoutTimer = e.target.checked;
    };

    async function loadQuestions() {
      try {
        if (isMixed) {
          questions = await Api.questions.mixed(25);
        } else if (companyId) {
          questions = await Api.questions.list({ company_id: companyId, preview: 'true' });
          if (!questions.length) {
            document.getElementById('question-text').textContent =
              'No questions for this company. Try Mixed Mode from the dashboard.';
            return;
          }
        } else {
          document.getElementById('question-text').textContent = 'Select a company or Mixed Mode from the dashboard.';
          return;
        }

        if (dailyId) {
          const idx = questions.findIndex((q) => q.id === dailyId);
          if (idx >= 0) currentIndex = idx;
        }

        InterviewTimer.startQuizTimer();
        renderQuestionList();
        showQuestion(currentIndex);
      } catch (ex) {
        document.getElementById('question-text').textContent = 'Failed to load questions: ' + ex.message;
      }
    }

    function renderQuestionList() {
      document.getElementById('question-list').innerHTML = questions.map((q, i) =>
        `<button type="button" class="q-mini-btn${i === currentIndex ? ' active' : ''}" onclick="showQuestion(${i})">Q${i + 1} · ${q.difficulty}</button>`
      ).join('');
    }

    window.showQuestion = async function (idx) {
      currentIndex = idx;
      submitted = false;
      document.getElementById('user-answer').value = '';
      document.getElementById('user-answer').disabled = true;
      document.getElementById('feedback-section').classList.add('hidden');
      document.getElementById('eval-result').classList.add('hidden');
      document.getElementById('tips-block').classList.add('hidden');
      document.getElementById('keypoints-block').classList.add('hidden');
      document.getElementById('submit-answer-btn').disabled = false;
      document.getElementById('submit-answer-btn').textContent = 'Submit Answer';

      const q = questions[idx];
      document.getElementById('question-text').textContent = q.question;
      document.getElementById('badges').innerHTML =
        Components.difficultyBadge(q.difficulty) + ' ' + Components.categoryBadge(q.category);
      document.getElementById('progress-bar').style.width = ((idx + 1) / questions.length * 100) + '%';
      document.getElementById('progress-text').textContent = `${idx + 1} / ${questions.length}`;
      document.getElementById('prev-btn').disabled = idx === 0;
      document.getElementById('next-btn').textContent =
        idx === questions.length - 1 ? 'Finish → Results' : 'Next Question';
      document.getElementById('next-btn').disabled = true;

      const diff = q.difficulty || 'Medium';
      const ans = InterviewTimer.settings?.answer_by_difficulty?.[diff] ||
        { Easy: 45, Medium: 90, Hard: 120 }[diff] || 90;
      document.getElementById('timer-hint').textContent =
        `${diff}: prep 45s · answer ${ans}s · Quiz max 30 min`;

      await InterviewTimer.startQuestion(isMixed ? '' : companyId, diff);
      renderQuestionList();
    };

    function renderScoreBreakdown(result) {
      const b = result.score_breakdown || {};
      const rows = [
        ['Content', b.content ?? result.similarity_score],
        ['Communication', b.communication ?? result.communication_score],
        ['Grammar', b.grammar ?? result.grammar_score],
        ['Confidence', b.confidence ?? result.confidence_score],
      ];
      return rows.map(([label, val]) => `
        <div class="score-bar-row">
          <span class="score-bar-label">${label}</span>
          <div class="score-bar-track"><div class="score-bar-fill" style="width:${Math.min(100, val || 0)}%"></div></div>
          <span class="score-bar-pct">${val ?? 0}%</span>
        </div>`).join('');
    }

    async function submitAnswer(auto = false) {
      if (InterviewTimer.phase === 'prep') {
        Components.toast('Wait for prep time to finish', 'error');
        return;
      }
      const userAns = document.getElementById('user-answer').value.trim();
      if (!userAns && !auto) {
        Components.toast('Enter your answer first', 'error');
        return;
      }

      submitted = true;
      InterviewTimer.stopAll();
      document.getElementById('submit-answer-btn').disabled = true;
      document.getElementById('submit-answer-btn').textContent = auto ? 'Auto-submitted' : 'Submitted';

      let q = questions[currentIndex];
      try {
        q = await Api.questions.get(q.id);
        questions[currentIndex] = q;
      } catch (ex) {
        Components.toast('Could not load ideal answer: ' + ex.message, 'error');
        return;
      }

      document.getElementById('feedback-section').classList.remove('hidden');
      document.getElementById('answer-text').textContent = q.answer || '—';
      document.getElementById('explanation-text').textContent = q.explanation || '—';
      document.getElementById('year-asked').textContent = q.year_asked ? `Year asked: ${q.year_asked}` : '';

      const t = InterviewTimer.getTimingStats();
      document.getElementById('time-spent-label').textContent =
        `Prep: ${InterviewTimer.formatTime(t.prep_seconds_used)} · Total: ${InterviewTimer.formatTime(t.time_spent_seconds)}` +
        (t.practice_without_timer ? ' · Untimed practice' : ` · Answer: ${InterviewTimer.formatTime(t.answer_seconds_used)}`);

      if (q.tips?.length) {
        document.getElementById('tips-block').classList.remove('hidden');
        document.getElementById('tips-list').innerHTML = q.tips.map((t) => `<li>${t}</li>`).join('');
      }
      if (q.key_points?.length) {
        document.getElementById('keypoints-block').classList.remove('hidden');
        document.getElementById('keypoints-list').innerHTML = q.key_points.map((k) => `<li>${k}</li>`).join('');
      }

      document.getElementById('next-btn').disabled = false;
    }

    document.getElementById('submit-answer-btn').onclick = () => submitAnswer(false);

    document.getElementById('next-btn').onclick = () => {
      if (currentIndex < questions.length - 1) showQuestion(currentIndex + 1);
      else finishInterview();
    };
    document.getElementById('prev-btn').onclick = () => {
      if (currentIndex > 0) showQuestion(currentIndex - 1);
    };

    function finishInterview() {
      const q = isMixed ? 'mode=mixed' : `company=${companyId}`;
      location.href = '/results.html?' + q;
    }

    document.getElementById('bookmark-btn').onclick = async () => {
      const q = questions[currentIndex];
      try {
        await Api.progress.bookmark({
          question_id: q.id,
          company_name: q.company_name || companyName,
          question_text: q.question,
        });
        Components.toast('Bookmarked!');
      } catch (ex) {
        Components.toast(ex.message, 'error');
      }
    };

    document.getElementById('evaluate-btn').onclick = async () => {
      const q = questions[currentIndex];
      const userAns = document.getElementById('user-answer').value;
      if (!userAns.trim()) {
        Components.toast('Enter your answer first', 'error');
        return;
      }
      const btn = document.getElementById('evaluate-btn');
      btn.disabled = true;
      btn.textContent = 'Evaluating...';
      try {
        const result = await Api.evaluate({
          user_answer: userAns,
          ideal_answer: q.answer,
          question: q.question,
          category: q.category,
        });
        const t = InterviewTimer.getTimingStats();
        await Api.progress.save({
          company_id: companyId || q.company_id,
          company_name: q.company_name || companyName,
          question_id: q.id,
          score: result.overall_score,
          category: q.category,
          difficulty: q.difficulty,
          user_answer: userAns,
          thinking_seconds_used: t.prep_seconds_used,
          time_spent_seconds: t.time_spent_seconds,
          revealed_early: false,
        });
        const el = document.getElementById('eval-result');
        el.classList.remove('hidden');
        el.innerHTML = `
          <div class="eval-header">
            <div class="score-ring">${result.overall_score}</div>
            <div>
              <p class="font-bold text-lg">Overall Score</p>
              <p class="text-sm text-muted">${result.feedback || ''}</p>
            </div>
          </div>
          <div class="score-breakdown mt-4">${renderScoreBreakdown(result)}</div>
          <ul class="text-sm text-muted mt-4">${(result.suggestions || []).map((s) => `<li style="margin:0.35rem 0">• ${s}</li>`).join('')}</ul>`;
      } catch (ex) {
        Components.toast(ex.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Evaluate with AI';
      }
    };

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      document.getElementById('voice-btn').onclick = () => {
        if (InterviewTimer.phase === 'prep') {
          Components.toast('Wait until prep ends', 'error');
          return;
        }
        rec.onresult = (e) => {
          let t = '';
          for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
          document.getElementById('user-answer').value = t;
        };
        rec.start();
        document.getElementById('voice-btn').textContent = '🔴 Listening...';
        rec.onend = () => {
          document.getElementById('voice-btn').textContent = '🎤 Voice input';
        };
      };
    } else {
      document.getElementById('voice-btn').style.display = 'none';
    }

    window.addEventListener('beforeunload', () => InterviewTimer.destroy());
    loadQuestions();
  </script>
</body>
</html>
