<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo — Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-layout page-enter">
  <div class="page-bg"><div class="gradient-orb gradient-orb-3"></div></div>

  <header class="mobile-header">
    <button type="button" onclick="AppUI.toggleSidebar(true)" aria-label="Menu" class="btn-ghost btn-sm" style="border:none">☰</button>
    <img src="/assets/logo.png" alt="Prepzo" style="height:32px">
    <div class="theme-toggle" data-theme-toggle><div class="theme-toggle-knob"></div></div>
  </header>

  <aside class="sidebar" id="app-sidebar">
    <a href="/" style="display:block;margin-bottom:2rem"><img src="/assets/logo.png" alt="Prepzo" style="height:40px;width:auto"></a>
    <nav style="flex:1;display:flex;flex-direction:column;gap:0.25rem">
      <a href="/dashboard.html" class="sidebar-link active">Dashboard</a>
      <a href="/results.html" class="sidebar-link">Results</a>
      <button type="button" id="nav-leaderboard" class="sidebar-link">Leaderboard</button>
    </nav>
    <button type="button" id="logout-btn" class="sidebar-link" style="color:#f87171">Logout</button>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="AppUI.toggleSidebar(false)"></div>

  <main class="main-content" style="position:relative;z-index:1">
    <header class="flex flex-wrap justify-between items-center gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-bold">Welcome, <span id="user-name">User</span></h1>
        <p class="text-sm text-muted">Ready to practice today?</p>
      </div>
      <div class="flex items-center gap-3 hide-mobile">
        <div class="theme-toggle" data-theme-toggle><div class="theme-toggle-knob"></div></div>
        <input type="search" id="search" placeholder="Search companies..." class="input" style="width:220px">
      </div>
    </header>

    <div class="grid grid-4 gap-4 mb-8">
      <div class="glass-card stat-card">
        <p class="text-xs text-muted">Practice Streak</p>
        <p class="stat-value" id="stat-streak">0</p>
        <p class="text-xs text-muted">days</p>
      </div>
      <div class="glass-card stat-card">
        <p class="text-xs text-muted">Questions Done</p>
        <p class="stat-value" id="stat-total" style="color:var(--text-primary)">0</p>
      </div>
      <div class="glass-card stat-card">
        <p class="text-xs text-muted">Bookmarks</p>
        <p class="stat-value" id="stat-bookmarks" style="color:var(--text-primary)">0</p>
      </div>
      <div class="glass-card stat-card">
        <p class="text-xs text-muted">Daily Challenge</p>
        <button id="daily-btn" class="btn-primary btn-sm mt-2 w-full">Start Challenge</button>
      </div>
    </div>

    <section class="mb-8">
      <h2 class="text-lg font-semibold mb-4">Choose a company to practice</h2>
      <div class="flex flex-wrap gap-3 mb-6">
        <button id="btn-yes" class="btn-primary btn-sm">All Companies</button>
        <button id="btn-trending" class="btn-ghost btn-sm">Trending Only</button>
      </div>
      <div id="companies-grid" class="grid grid-4 gap-4"></div>
    </section>

    <section id="leaderboard-section" class="hidden mb-8">
      <h2 class="text-lg font-semibold mb-4">Leaderboard</h2>
      <div id="leaderboard" class="glass-card card-pad"></div>
    </section>

    <section>
      <h2 class="text-lg font-semibold mb-4">Recently Practiced</h2>
      <div id="recent-list" class="text-sm text-muted">No practice sessions yet.</div>
    </section>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    document.getElementById('user-name').textContent = Api.getUser()?.name || 'User';
    document.getElementById('logout-btn').onclick = () => { Api.setToken(null); Api.setUser(null); location.href = '/'; };

    let allCompanies = [];

    async function loadStats() {
      try {
        const stats = await Api.progress.stats();
        document.getElementById('stat-streak').textContent = stats.streak || 0;
        document.getElementById('stat-total').textContent = stats.total_practiced || 0;
        if (stats.recent_companies?.length) {
          document.getElementById('recent-list').innerHTML = stats.recent_companies.map(c =>
            `<span style="display:inline-block;padding:0.35rem 0.85rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:0.25rem 0.5rem 0.25rem 0">${c}</span>`
          ).join('');
        }
      } catch {}
      try {
        const bm = await Api.progress.bookmarks();
        document.getElementById('stat-bookmarks').textContent = bm.length;
      } catch {}
    }

    function renderCompanies(list) {
      document.getElementById('companies-grid').innerHTML = list.length
        ? list.map(c => Components.companyCard(c, `location.href='/interview.html?company=${c.id}&name=${encodeURIComponent(c.name)}'`)).join('')
        : '<p class="text-muted">No companies found.</p>';
    }

    async function loadCompanies(trending = false) {
      try {
        allCompanies = await Api.companies.list(trending);
        renderCompanies(allCompanies);
      } catch {
        document.getElementById('companies-grid').innerHTML = '<p class="text-muted">Start the backend server to load companies.</p>';
      }
    }

    document.getElementById('btn-yes').onclick = () => loadCompanies(false);
    document.getElementById('btn-trending').onclick = () => loadCompanies(true);
    document.getElementById('search')?.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderCompanies(allCompanies.filter(c => c.name.toLowerCase().includes(q)));
    });
    document.getElementById('daily-btn').onclick = async () => {
      try {
        const q = await Api.questions.daily();
        location.href = `/interview.html?company=${q.company_id}&name=${encodeURIComponent(q.company_name)}&daily=${q.id}`;
      } catch (ex) { Components.toast(ex.message, 'error'); }
    };
    document.getElementById('nav-leaderboard').onclick = async (e) => {
      e.preventDefault();
      const sec = document.getElementById('leaderboard-section');
      sec.classList.toggle('hidden');
      if (!sec.classList.contains('hidden')) {
        try {
          const lb = await Api.progress.leaderboard();
          document.getElementById('leaderboard').innerHTML = lb.length ? lb.map((r,i) =>
            `<div class="flex justify-between py-3" style="border-bottom:1px solid var(--border)"><span class="font-medium">#${i+1} ${r.name}</span><span class="text-muted text-sm">${r.total} Q · ${r.avg_score}% avg</span></div>`
          ).join('') : '<p class="text-muted">No leaderboard data yet.</p>';
        } catch { document.getElementById('leaderboard').innerHTML = '<p class="text-muted">Leaderboard unavailable</p>'; }
      }
    };

    loadCompanies(true);
    loadStats();
  </script>
</body>
</html>
