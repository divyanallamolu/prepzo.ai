<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo — Sign In</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page page-enter">
  <div class="page-bg">
    <div class="gradient-orb gradient-orb-1"></div>
    <div class="gradient-orb gradient-orb-2"></div>
  </div>

  <section class="auth-brand">
    <div class="text-center" style="position:relative;z-index:1">
      <a href="/" class="brand-logo" style="display:inline-block;margin-bottom:1.5rem">
        <img src="/assets/logo.png" alt="Prepzo" style="height:72px;width:auto;max-width:280px">
      </a>
      <p class="brand-tagline">Prepare. Practice. Perform.</p>
      <p class="text-muted mt-8" style="max-width:360px;margin-left:auto;margin-right:auto">
        Join thousands preparing for dream roles at Google, Amazon, Microsoft, and more.
      </p>
      <div class="hero-stats mt-12" style="border:none;padding-top:0">
        <div class="hero-stat"><strong>AI</strong><span class="text-sm text-muted">Scoring</span></div>
        <div class="hero-stat"><strong>10+</strong><span class="text-sm text-muted">Companies</span></div>
      </div>
    </div>
  </section>

  <section class="auth-form-wrap">
    <div style="width:100%;max-width:420px;position:relative;z-index:1">
      <div class="flex justify-between items-center mb-6">
        <a href="/" class="text-sm text-muted hide-desktop">← Home</a>
        <div class="theme-toggle" data-theme-toggle><div class="theme-toggle-knob"></div></div>
      </div>
      <div class="glass-card card-pad">
        <h2 id="form-title" class="page-heading-sm mb-2">Welcome back</h2>
        <p id="form-subtitle" class="text-sm text-muted mb-8">Sign in to continue practicing</p>
        <form id="auth-form">
          <div id="name-field" class="hidden mb-4">
            <label class="label" for="name">Full Name</label>
            <input type="text" id="name" class="input" placeholder="Jane Doe">
          </div>
          <div class="mb-4">
            <label class="label" for="email">Email</label>
            <input type="email" id="email" required class="input" placeholder="you@email.com">
          </div>
          <div class="mb-4">
            <label class="label" for="password">Password</label>
            <div class="relative">
              <input type="password" id="password" required minlength="6" class="input" placeholder="Min 6 characters">
              <button type="button" id="toggle-pwd" class="btn-ghost btn-sm" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:0.25rem 0.5rem;border:none">Show</button>
            </div>
          </div>
          <p id="error-msg" class="text-sm hidden mb-4" style="color:#f87171"></p>
          <button type="submit" id="submit-btn" class="btn-primary w-full">Sign In</button>
        </form>
        <p class="mt-6 text-center text-sm text-muted">
          <span id="toggle-text">Don't have an account?</span>
          <button type="button" id="toggle-mode" class="text-accent font-medium" style="background:none;border:none;cursor:pointer;margin-left:4px">Sign up</button>
        </p>
        <a href="/" class="block mt-4 text-center text-sm text-muted">← Back to home</a>
      </div>
    </div>
  </section>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let isRegister = params.get('mode') === 'register';

    function updateUI() {
      document.getElementById('name-field').classList.toggle('hidden', !isRegister);
      document.getElementById('form-title').textContent = isRegister ? 'Create account' : 'Welcome back';
      document.getElementById('form-subtitle').textContent = isRegister ? 'Start your interview prep journey' : 'Sign in to continue practicing';
      document.getElementById('submit-btn').textContent = isRegister ? 'Create Account' : 'Sign In';
      document.getElementById('toggle-text').textContent = isRegister ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('toggle-mode').textContent = isRegister ? 'Sign in' : 'Sign up';
    }
    updateUI();
    document.getElementById('toggle-mode').onclick = () => { isRegister = !isRegister; updateUI(); };
    document.getElementById('toggle-pwd').onclick = () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-pwd').textContent = inp.type === 'password' ? 'Show' : 'Hide';
    };
    document.getElementById('auth-form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error-msg');
      err.classList.add('hidden');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Loading...';
      try {
        const body = { email: document.getElementById('email').value, password: document.getElementById('password').value };
        if (isRegister) body.name = document.getElementById('name').value;
        const res = isRegister ? await Api.auth.register(body) : await Api.auth.login(body);
        Api.setToken(res.token);
        Api.setUser(res.user);
        location.href = '/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = isRegister ? 'Create Account' : 'Sign In';
      }
    };
    if (Api.getToken()) location.href = '/dashboard.html';
  </script>
</body>
</html>
