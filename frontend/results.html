<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo — Results</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="app-layout page-enter">
  <header class="mobile-header">
    <button type="button" onclick="AppUI.toggleSidebar(true)" class="btn-ghost btn-sm" style="border:none">☰</button>
    <span class="font-semibold">Results</span>
    <div class="theme-toggle" data-theme-toggle><div class="theme-toggle-knob"></div></div>
  </header>

  <aside class="sidebar" id="app-sidebar">
    <a href="/" style="display:block;margin-bottom:2rem"><img src="/assets/logo.png" alt="Prepzo" style="height:40px"></a>
    <nav style="flex:1;display:flex;flex-direction:column;gap:0.25rem">
      <a href="/dashboard.html" class="sidebar-link">Dashboard</a>
      <a href="/results.html" class="sidebar-link active">Results</a>
    </nav>
    <button type="button" id="logout-btn" class="sidebar-link" style="color:#f87171">Logout</button>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="AppUI.toggleSidebar(false)"></div>

  <main class="main-content" style="position:relative;z-index:1">
    <header class="mb-8 hide-mobile">
      <h1 class="text-3xl font-bold">Results & Feedback</h1>
      <p class="text-muted">Your performance analytics</p>
    </header>

    <div class="grid grid-4 gap-4 mb-8">
      <div class="glass-card stat-card text-center">
        <p class="text-xs text-muted">Total Practiced</p>
        <p class="stat-value" id="total-practiced">0</p>
      </div>
      <div class="glass-card stat-card text-center">
        <p class="text-xs text-muted">Streak</p>
        <p class="stat-value" id="streak" style="color:var(--text-primary)">0</p>
      </div>
      <div class="glass-card stat-card text-center">
        <p class="text-xs text-muted">Avg Time / Question</p>
        <p class="stat-value" id="avg-time" style="color:var(--text-primary)">—</p>
      </div>
      <div class="glass-card stat-card text-center">
        <p class="text-xs text-muted">Fastest Answer</p>
        <p class="stat-value" id="fastest-time" style="font-size:1.25rem">—</p>
      </div>
    </div>

    <div class="glass-card card-pad mb-8" id="timing-section">
      <h2 class="font-semibold mb-4">Time Analytics</h2>
      <p id="total-time-spent" class="text-sm text-muted mb-4"></p>
      <div id="fastest-list" class="text-sm text-muted"></div>
    </div>

    <div class="grid grid-2 gap-6 mb-8">
      <div class="glass-card card-pad"><h2 class="font-semibold mb-4">By Category</h2><canvas id="category-chart" height="200"></canvas></div>
      <div class="glass-card card-pad"><h2 class="font-semibold mb-4">Score Trend</h2><canvas id="score-chart" height="200"></canvas></div>
    </div>

    <div class="glass-card card-pad mb-8">
      <h2 class="font-semibold mb-4">AI Improvement Suggestions</h2>
      <ul id="suggestions" class="text-sm text-muted" style="list-style:disc;padding-left:1.25rem"></ul>
    </div>

    <div class="glass-card card-pad">
      <h2 class="font-semibold mb-4">Share Feedback</h2>
      <form id="feedback-form">
        <div class="grid grid-2 gap-4 mb-4">
          <div><label class="label">Rating</label>
            <select id="rating" class="select">
              <option value="5">5 — Excellent</option><option value="4">4 — Good</option>
              <option value="3">3 — Average</option><option value="2">2</option><option value="1">1</option>
            </select>
          </div>
          <div><label class="label">Type</label>
            <select id="fb-type" class="select">
              <option value="feature">Feature</option><option value="bug">Bug</option><option value="general">General</option>
            </select>
          </div>
        </div>
        <div class="mb-4"><label class="label">Message</label>
          <textarea id="message" rows="4" required class="input" placeholder="Tell us what you think..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Submit Feedback</button>
      </form>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (!requireAuth()) throw new Error('auth');
    document.getElementById('logout-btn').onclick = () => { Api.setToken(null); Api.setUser(null); location.href = '/'; };

    const chartColors = { text: '#94a3b8', grid: 'rgba(255,255,255,0.06)' };

    async function loadResults() {
      try {
        const stats = await Api.progress.stats();
        document.getElementById('total-practiced').textContent = stats.total_practiced || 0;
        document.getElementById('streak').textContent = stats.streak || 0;
        const timing = stats.timing || {};
        const avg = timing.avg_time_spent_seconds || 0;
        const min = timing.min_time_spent_seconds || 0;
        document.getElementById('avg-time').textContent = avg ? `${Math.floor(avg / 60)}m ${Math.round(avg % 60)}s` : '—';
        document.getElementById('fastest-time').textContent = min ? `${Math.floor(min / 60)}m ${min % 60}s` : '—';
        document.getElementById('total-time-spent').textContent = timing.total_time_spent_seconds
          ? `Total practice time: ${Math.floor(timing.total_time_spent_seconds / 60)} minutes`
          : 'Complete timed practice sessions to see analytics.';
        const fastest = timing.fastest_completions || [];
        document.getElementById('fastest-list').innerHTML = fastest.length
          ? '<p class="font-medium mb-2">Fastest completions:</p><ul style="list-style:disc;padding-left:1.25rem">' +
            fastest.map((f) =>
              `<li>${f.company_name || 'Practice'} — ${f.time_spent_seconds}s (${f.difficulty || ''})</li>`
            ).join('') + '</ul>'
          : '';

        const cats = stats.by_category || [];
        const weak = cats.filter(c => (c.avg_score || 0) < 60).map(c => c._id);
        const suggestions = [];
        if (weak.includes('Technical')) suggestions.push('Review technical fundamentals and system design.');
        if (weak.includes('Behavioral')) suggestions.push('Practice STAR method for behavioral questions.');
        if (weak.includes('HR')) suggestions.push('Research company culture for HR rounds.');
        if (!suggestions.length) suggestions.push('Keep your daily streak — consistency beats cramming.');
        document.getElementById('suggestions').innerHTML = suggestions.map(s => `<li>${s}</li>`).join('');

        new Chart(document.getElementById('category-chart'), {
          type: 'doughnut',
          data: { labels: cats.map(c => c._id || '?'), datasets: [{ data: cats.map(c => c.count), backgroundColor: ['#ff4500','#6366f1','#06b6d4'] }] },
          options: { plugins: { legend: { labels: { color: chartColors.text } } } },
        });

        const progress = await Api.progress.list();
        const scores = progress.slice(0, 10).reverse().map(p => p.score || 0);
        new Chart(document.getElementById('score-chart'), {
          type: 'line',
          data: { labels: scores.map((_,i) => `Q${i+1}`), datasets: [{ label: 'Score', data: scores, borderColor: '#ff4500', tension: 0.35 }] },
          options: { scales: { y: { max: 100, ticks: { color: chartColors.text } }, x: { ticks: { color: chartColors.text } } } },
        });
      } catch {
        document.getElementById('suggestions').innerHTML = '<li>Connect to backend to view analytics.</li>';
      }
    }

    document.getElementById('feedback-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await Api.feedback.submit({
          rating: +document.getElementById('rating').value,
          type: document.getElementById('fb-type').value,
          message: document.getElementById('message').value,
        });
        Components.toast('Thank you for your feedback!');
        e.target.reset();
      } catch (ex) { Components.toast(ex.message, 'error'); }
    };

    loadResults();
  </script>
</body>
</html>
