<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo — Admin Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6 page-enter">
  <div class="page-bg"><div class="gradient-orb gradient-orb-1"></div></div>
  <div class="glass-card card-pad w-full max-w-md" style="position:relative;z-index:1">
    <a href="/" class="brand-logo" style="display:block;text-align:center;margin-bottom:1rem">
      <img src="/assets/logo.png" alt="Prepzo" style="height:48px;width:auto;margin:0 auto">
    </a>
    <p class="text-xs text-accent font-semibold text-center mb-2" style="letter-spacing:0.1em">ADMIN LOGIN</p>
    <p class="text-sm text-muted text-center mb-8">Secure admin access only</p>
    <form id="admin-form">
      <div class="mb-4">
        <label class="label" for="email">Email</label>
        <input type="email" id="email" required class="input" placeholder="admin@prepzo.ai">
      </div>
      <div class="mb-4">
        <label class="label" for="password">Password</label>
        <input type="password" id="password" required class="input" placeholder="Password">
      </div>
      <p id="error" class="text-sm hidden mb-4" style="color:#f87171"></p>
      <button type="submit" class="btn-primary w-full">Admin Sign In</button>
    </form>
    <a href="/" class="block mt-6 text-center text-sm text-muted">← Back to site</a>
  </div>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('admin-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await Api.auth.adminLogin({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        Api.setToken(res.token, 'admin');
        Api.setUser(res.user, 'admin');
        window.location.replace('/admin/');
      } catch (ex) {
        const err = document.getElementById('error');
        err.textContent = ex.message;
        err.classList.remove('hidden');
      }
    };
    if (Api.getToken('admin')) window.location.replace('/admin/');
  </script>
</body>
</html>
