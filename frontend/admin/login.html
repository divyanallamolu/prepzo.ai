<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prepzo Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="gradient-orb gradient-orb-1"></div>
  <div class="glass-card p-8 w-full max-w-md relative z-10">
    <a href="/" class="brand-logo block mb-4">
      <img src="/assets/logo.png" alt="Prepzo" class="h-12 w-auto max-w-[200px] object-contain mx-auto" />
    </a>
    <p class="text-xs text-[var(--accent)] font-semibold text-center mb-2 tracking-wide">ADMIN LOGIN</p>
    <p class="text-sm text-[var(--text-muted)] mb-8">Secure admin access only</p>
    <form id="admin-form" class="space-y-4">
      <input type="email" id="email" required placeholder="admin@prepzo.ai" class="w-full px-4 py-3 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border)] input-glow">
      <input type="password" id="password" required placeholder="Password" class="w-full px-4 py-3 rounded-xl bg-[var(--bg-secondary)] border border-[var(--border)] input-glow">
      <p id="error" class="text-red-400 text-sm hidden"></p>
      <button type="submit" class="btn-primary w-full">Admin Sign In</button>
    </form>
    <a href="/" class="block mt-4 text-center text-sm text-[var(--text-muted)]">Back to site</a>
  </div>
  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script>
    if (typeof Api === 'undefined') {
      document.getElementById('error').textContent = 'Scripts failed to load. Press Ctrl+F5.';
      document.getElementById('error').classList.remove('hidden');
    }
    document.getElementById('admin-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await Api.auth.adminLogin({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        Api.setToken(res.token, 'admin');
        Api.setUser(res.user, 'admin');
        location.href = '/admin/';
      } catch (ex) {
        const err = document.getElementById('error');
        err.textContent = ex.message;
        err.classList.remove('hidden');
      }
    };
    if (typeof Api !== 'undefined' && Api.getToken('admin')) location.href = '/admin/';
  </script>
</body>
</html>
